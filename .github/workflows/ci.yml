name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cargo-full
      - run: cargo build --workspace --all-targets --features full

  test-qbey:
    name: test-qbey (${{ matrix.axis }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - axis: min
            # Empty: use the crate default, i.e. the minimum supported version.
            mysql_tag: ""
          - axis: max
            # renovate: image=mysql
            mysql_tag: "26.7"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cargo-full
          save-if: false
      - run: cargo test -p qbey --features returning,conflict,test-sqlx,test-sqlx-mysql,test-rusqlite,test-libsql
        env:
          QBEY_TEST_MYSQL_TAG: ${{ matrix.mysql_tag }}

  test-qbey-postgres:
    name: test-qbey-postgres (${{ matrix.axis }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - axis: min
            # Empty: use the crate default, i.e. the minimum supported version.
            postgres_tag: ""
          - axis: max
            # renovate: image=postgres
            postgres_tag: "18-alpine"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cargo-full
          save-if: false
      - run: cargo test -p qbey --features returning,conflict,test-tokio-postgres,test-postgres
        env:
          QBEY_TEST_POSTGRES_TAG: ${{ matrix.postgres_tag }}

  test-qbey-mysql:
    name: test-qbey-mysql (${{ matrix.axis }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - axis: min
            # Empty: use the crate default, i.e. the minimum supported version.
            mysql_tag: ""
            mariadb_tag: ""
          - axis: max
            # renovate: image=mysql
            mysql_tag: "26.7"
            # renovate: image=mariadb
            mariadb_tag: "12.3"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cargo-full
          save-if: false
      - run: cargo test -p qbey-mysql --features full
        env:
          QBEY_TEST_MYSQL_TAG: ${{ matrix.mysql_tag }}
          QBEY_TEST_MARIADB_TAG: ${{ matrix.mariadb_tag }}

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cargo-full
          save-if: false
      - run: cargo clippy -p qbey --all-targets --features full -- -D warnings
      - run: cargo clippy -p qbey-mysql --all-targets --features full -- -D warnings
